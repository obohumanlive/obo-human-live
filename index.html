<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG LOCATION - FREE MAP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0}#map{height:100vh} .top{position:fixed;top:0;left:0;right:0;z-index:999;background:#000;color:#0f0;padding:8px;text-align:center;font-weight:900}</style>
</head>
<body>
<div class="top">NIGERIA BIG LOCATION — FREE MAP — NO GOOGLE — 100% YOURS</div>
<div id="map"></div>
<script>
// 1. Map center Nigeria
let map = L.map('map').setView([9.08,8.67],6);

// 2. FREE MAP — OpenStreetMap — No API key — No Google bill
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19,
attribution:'© OpenStreetMap — FREE — No Google'
}).addTo(map);

// 3. Your Human Satellite pins — Real live later
L.marker([5.55,5.78]).addTo(map).bindPopup('Warri — Tap to see LIVE video soon');
L.marker([6.44,3.42]).addTo(map).bindPopup('Lagos — Tap to see LIVE video soon');
L.marker([9.07,7.48]).addTo(map).bindPopup('Abuja — Command Center');
</script>
</body>
</html>
