<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>NIGERIA LIVE MAP - Big Location</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#000;color:#fff}
.top{padding:10px 12px;background:#fff;color:#000;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:14px}
.live{background:#00c853;color:#fff;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:900}
#map{width:100%;height:55vh}
.feed{padding:10px;background:#0e1628}
.feed h4{font-size:12px;margin-bottom:6px}
.feed video{width:100%;height:200px;background:#000;border-radius:10px;object-fit:cover}
.btn{width:100%;padding:12px;background:#ffaa00;color:#000;border:none;border-radius:30px;font-weight:900;margin-top:8px}
.info{font-size:10px;color:#8aa0c5;margin-top:6px}
</style>
</head>
<body>
<div class="top">
<div><b>NIGERIA LIVE MAP</b><br><small style="color:#555">Satellite View • Live Human</small></div>
<div class="live">● LIVE <span id="time"></span></div>
</div>

<div id="map"></div>

<div class="feed">
<h4>LIVE CAMERA — Your Phone</h4>
<video id="cam" autoplay playsinline muted></video>
<button class="btn" onclick="startAll()">TAP TO START LIVE — Camera + GPS</button>
<div class="info" id="status">Tap button — Allow camera + location — Map go show your blue dot live for Nigeria</div>
</div>

<script>
let map = L.map('map',{zoomControl:false}).setView([9.08,8.67],6); // Nigeria center

// Free satellite — Esri — Clear for Nigeria — No grey — Free forever
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
maxZoom:19, attribution:'Esri Satellite'
}).addTo(map);

// Nigeria pipeline markers — Real locations
L.marker([5.55,5.78]).addTo(map).bindPopup('Warri — Pipeline 14B');
L.marker([5.35,5.46]).addTo(map).bindPopup('Forcados — 87km');
L.marker([6.44,3.42]).addTo(map).bindPopup('Lagos');
L.marker([9.07,7.48]).addTo(map).bindPopup('Abuja — Command Center');
L.marker([4.82,7.04]).addTo(map).bindPopup('Port Harcourt');

let myDot = null;

function updateTime(){
document.getElementById('time').innerText = new Date().toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit'})+' WAT';
}
setInterval(updateTime,1000); updateTime();

async function startAll(){
try{
let s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
document.getElementById('cam').srcObject = s;
document.getElementById('status').innerText = '✅ Camera LIVE — Now starting GPS...';
startGPS();
}catch(e){
document.getElementById('status').innerText = 'Camera block — Allow camera for Chrome — Tap again';
}
}

function startGPS(){
if(!navigator.geolocation){document.getElementById('status').innerText='No GPS'; return;}
navigator.geolocation.watchPosition(p=>{
let lat=p.coords.latitude, lon=p.coords.longitude;
if(!myDot){
myDot = L.circleMarker([lat,lon],{radius:8,color:'#00ff88',fillColor:'#00ff88',fillOpacity:1}).addTo(map).bindPopup('YOU LIVE');
map.setView([lat,lon],16);
}else{
myDot.setLatLng([lat,lon]);
}
document.getElementById('status').innerText = '✅ LIVE — You dey '+lat.toFixed(5)+','+lon.toFixed(5)+' — Map dey show you for Nigeria — Satellite view';
},err=>{document.getElementById('status').innerText='GPS error — Allow location';},{enableHighAccuracy:true});
}
</script>
</body>
</html>
