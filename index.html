<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oil-Truth LIVE MAP - Fixed Zoom - Warri</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#000;color:#fff;overflow:hidden}
.header{height:50px;background:#001a33;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:3px solid #00ff88;position:absolute;top:0;left:0;right:0;z-index:1000}
.live{background:#00ff88;color:#000;padding:5px 10px;border-radius:20px;font-weight:900;font-size:10px}
#map{position:absolute;top:50px;left:0;right:0;bottom:0;z-index:1}
#humanAuto{position:absolute;top:50px;left:0;right:0;bottom:0;z-index:5;background:#000;opacity:0.95}
#humanAuto video{width:100%;height:100%;object-fit:cover}
#gpsDot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#00ff88;color:#000;padding:10px 18px;border-radius:30px;font-weight:900;border:3px solid #fff;box-shadow:0 0 30px #00ff88;z-index:20}
.info{position:absolute;top:60px;left:10px;z-index:30;background:rgba(0,0,0,.9);padding:10px;border-radius:10px;border:1px solid #00ff88;max-width:320px}
.controls{position:absolute;bottom:10px;left:10px;right:10px;z-index:30;display:flex;gap:6px}
.controls button{flex:1;padding:12px;border:none;border-radius:20px;font-weight:900;font-size:11px}
.green{background:#00ff88;color:#000} .red{background:#ff2d2d;color:#fff} .dark{background:rgba(0,0,0,.8);color:#00ff88;border:1px solid #00ff88}
.small{font-size:10px;color:#8aa0c5}
</style>
</head>
<body>
<div class="header"><div>🛢️ <b>OIL-TRUTH LIVE MAP</b> — FIXED ZOOM — WARRI — HUMAN AUTO LIVE</div><div class="live">● ZOOM FIXED</div></div>
<div id="map"></div>
<div id="humanAuto"><video id="av" autoplay playsinline muted></video><div id="gpsDot">🔵 YOU LIVE — Warri</div></div>
<div class="info">
<div style="color:#00ff88;font-weight:900;font-size:11px">✅ Zoom fixed — No more "Map data not yet available"</div>
<div class="small" id="st">Opening — Map + Camera auto-start — You see people live — Zoom to see face — Pinch to zoom</div>
<div class="small" id="gps">GPS auto...</div>
</div>
<div class="controls">
<button class="dark" onclick="toggleHuman()">👁️ SHOW/HIDE LIVE HUMANS</button>
<button class="dark" onclick="switchLayer()">🛰️ SWITCH SAT/STREET</button>
<button class="red" onclick="report()">🔒 REPORT</button>
</div>
<script>
let map=L.map('map',{zoomControl:true,maxZoom:22}).setView([5.55,5.78],15);

// FIXED LAYERS — No more "Map data not yet available" — Use multiple sources with fallback
// Google Satellite (works better for Warri zoom) + Esri + OSM — All with maxNativeZoom fix
let googleSat=L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{maxZoom:22,maxNativeZoom:20,attribution:'Google Satellite — Human Live Backup'});
let esriSat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:22,maxNativeZoom:19,attribution:'Esri'});
let osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:22,maxNativeZoom:19});

googleSat.addTo(map); // Default — Google satellite works for Warri zoom — No more grey

let pipe=[[5.516,5.75],[5.55,5.78],[5.67,5.90]];
L.polyline(pipe,{color:'#ff2d2d',weight:8,dashArray:'10,10'}).addTo(map).bindPopup('PPMC PIPELINE — Warri-Sapele — 87km');

let currentLayer='google';
function switchLayer(){
if(currentLayer==='google'){map.removeLayer(googleSat); esriSat.addTo(map); currentLayer='esri'; document.getElementById('st').innerText='Switched to Esri — If grey, switch again';}
else if(currentLayer==='esri'){map.removeLayer(esriSat); osm.addTo(map); currentLayer='osm'; document.getElementById('st').innerText='Switched to Street — Roads clear — Zoom works';}
else{map.removeLayer(osm); googleSat.addTo(map); currentLayer='google'; document.getElementById('st').innerText='Switched to Google Satellite — Best for Warri zoom — No grey';}
}

let humanDiv=document.getElementById('humanAuto'), humanVisible=true;
function toggleHuman(){
humanVisible=!humanVisible;
humanDiv.style.display=humanVisible?'block':'none';
document.getElementById('st').innerText=humanVisible?'Live humans showing — People, moto live — Zoom to see face':'Live humans hidden — Only satellite map — Click again to show humans';
}

async function autoStart(){
try{
let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920}},audio:true});
document.getElementById('av').srcObject=s;
document.getElementById('st').innerText='✅ AUTO LIVE — You see live ground NOW — Zoom with pinch/mouse wheel — People working live — Toggle button to hide/show — No grey map';
autoGPS();
}catch(e){
document.getElementById('st').innerText='Tap screen once to start auto-live — Chrome need one tap — After that auto';
document.body.addEventListener('click', async ()=>{
let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920}},audio:true});
document.getElementById('av').srcObject=s;
autoGPS();
},{once:true});
}
}
function autoGPS(){
if(!navigator.geolocation)return;
navigator.geolocation.watchPosition(p=>{
let lat=p.coords.latitude, lon=p.coords.longitude;
document.getElementById('gps').innerText='GPS LIVE '+lat.toFixed(5)+','+lon.toFixed(5)+' Acc '+Math.round(p.coords.accuracy)+'m';
document.getElementById('gpsDot').innerText='🔵 LIVE '+lat.toFixed(5)+','+lon.toFixed(5);
document.getElementById('gpsDot').style.display='block';
},null,{enableHighAccuracy:true});
}
function report(){alert('🚨 SILENT REPORT SAVED — Zoom fixed — Live humans — GPS — For NNPC — '+new Date().toLocaleString());}

window.addEventListener('load', ()=>{map.invalidateSize(); autoStart();});
setTimeout(()=>map.invalidateSize(),1000);
</script>
</body>
</html>
