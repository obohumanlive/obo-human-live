<script type="module">

const $ = id => document.getElementById(id);

const avatarFile = $("avatarFile");
const avatar = $("avatar");
const placeholder = $("placeholder");

const startButton = $("startButton");
const stopButton = $("stopButton");

const video = $("cameraPreview");

const statusBox = $("status");
const cameraStatus = $("cameraStatus");
const faceStatus = $("faceStatus");
const bodyStatus = $("bodyStatus");

const trackingMode = $("trackingMode");

let cameraStream = null;
let faceTracker = null;
let poseTracker = null;
let running = false;
let animationFrame = null;
let lastVideoTime = -1;
let initialBodyPosition = null;
let imageURL = null;


/* LOAD IMAGE WITHOUT NEEDING AI LIBRARIES */

avatarFile.addEventListener("change", event => {

    const file = event.target.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        statusBox.textContent = "Please choose an image.";
        return;
    }

    if (imageURL) URL.revokeObjectURL(imageURL);

    imageURL = URL.createObjectURL(file);

    avatar.onload = () => {
        avatar.style.display = "block";
        placeholder.style.display = "none";
        avatar.style.transform = "none";

        statusBox.textContent =
            "Picture uploaded successfully. You can now start tracking.";
    };

    avatar.onerror = () => {
        statusBox.textContent =
            "Could not display this image. Please choose another.";
    };

    avatar.src = imageURL;

});


/* START TRACKING */

startButton.addEventListener("click", startTracking);

async function startTracking() {

    if (running) return;

    if (!avatar.src || avatar.style.display === "none") {
        statusBox.textContent = "Upload a picture first.";
        return;
    }

    if (!navigator.mediaDevices?.getUserMedia) {
        statusBox.textContent =
            "Camera access is unavailable. Open the website in Chrome using HTTPS.";
        return;
    }

    startButton.disabled = true;
    statusBox.textContent = "Loading the AI tracking library...";

    try {

        /* Load the library only when tracking starts. */

        const mp = await import(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm"
        );

        const vision = await mp.FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );

        statusBox.textContent = "Loading face tracking model...";

        faceTracker = await mp.FaceLandmarker.createFromOptions(
            vision,
            {
                baseOptions: {
                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numFaces: 1
            }
        );

        statusBox.textContent = "Loading body tracking model...";

        poseTracker = await mp.PoseLandmarker.createFromOptions(
            vision,
            {
                baseOptions: {
                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numPoses: 1
            }
        );

        statusBox.textContent = "Requesting webcam permission...";

        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user",
                width: { ideal: 640 },
                height: { ideal: 480 }
            },
            audio: false
        });

        video.srcObject = cameraStream;
        video.hidden = false;

        await video.play();

        running = true;
        lastVideoTime = -1;
        initialBodyPosition = null;

        stopButton.disabled = false;
        cameraStatus.textContent = "On";

        statusBox.textContent =
            "Tracking active. Keep your face and upper body visible.";

        processCamera();

    } catch (error) {

        console.error("OBO Avatar error:", error);

        statusBox.textContent =
            "Startup failed: " + error.message +
            ". Check your internet connection and Chrome camera permission.";

        stopTracking();

    }

}


/* PROCESS WEBCAM FRAMES */

function processCamera() {

    if (!running) return;

    if (
        video.readyState >= 2 &&
        video.currentTime !== lastVideoTime
    ) {

        lastVideoTime = video.currentTime;

        try {

            const now = performance.now();

            const faceResults =
                faceTracker.detectForVideo(video, now);

            const poseResults =
                poseTracker.detectForVideo(video, now);

            updateAvatar(faceResults, poseResults);

        } catch (error) {

            console.error("Tracking error:", error);

        }

    }

    animationFrame = requestAnimationFrame(processCamera);

}


/* MOVE THE UPLOADED IMAGE */

function updateAvatar(faceResults, poseResults) {

    const faces = faceResults.faceLandmarks || [];
    const poses = poseResults.landmarks || [];

    faceStatus.textContent =
        faces.length ? "Detected" : "Not detected";

    bodyStatus.textContent =
        poses.length ? "Detected" : "Not detected";

    if (!poses.length) return;

    const pose = poses[0];

    const leftShoulder = pose[11];
    const rightShoulder = pose[12];

    if (!leftShoulder || !rightShoulder) return;

    const current = {
        x: (leftShoulder.x + rightShoulder.x) / 2,
        y: (leftShoulder.y + rightShoulder.y) / 2,
        tilt: Math.atan2(
            rightShoulder.y - leftShoulder.y,
            rightShoulder.x - leftShoulder.x
        ) * 180 / Math.PI,
        width: Math.abs(leftShoulder.x - rightShoulder.x)
    };

    if (!initialBodyPosition) {
        initialBodyPosition = { ...current };
    }

    if (trackingMode.value === "face" && faces.length) {

        const face = faces[0];
        const nose = face[1];
        const leftEye = face[33];
        const rightEye = face[263];

        const x = (nose.x - 0.5) * 100;
        const y = (nose.y - 0.4) * 65;

        const rotation = Math.atan2(
            rightEye.y - leftEye.y,
            rightEye.x - leftEye.x
        ) * 180 / Math.PI;

        const safeRotation =
            Math.max(-18, Math.min(18, rotation));

        avatar.style.transform =
            `translate(${x}px, ${y}px) rotate(${safeRotation}deg)`;

    } else {

        const x =
            (initialBodyPosition.x - current.x) * 180;

        const y =
            (initialBodyPosition.y - current.y) * 150;

        const rotation = Math.max(
            -15,
            Math.min(
                15,
                current.tilt - initialBodyPosition.tilt
            )
        );

        const scale = Math.max(
            0.8,
            Math.min(
                1.2,
                current.width /
                Math.max(initialBodyPosition.width, 0.01)
            )
        );

        avatar.style.transform =
            `translate(${x}px, ${y}px) rotate(${rotation}deg) scale(${scale})`;

    }

}


/* STOP AND RELEASE THE CAMERA */

stopButton.addEventListener("click", stopTracking);

function stopTracking() {

    running = false;

    if (animationFrame !== null) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
    }

    if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
    }

    video.srcObject = null;
    video.hidden = true;

    if (faceTracker) {
        faceTracker.close();
        faceTracker = null;
    }

    if (poseTracker) {
        poseTracker.close();
        poseTracker = null;
    }

    cameraStatus.textContent = "Off";
    startButton.disabled = false;
    stopButton.disabled = true;

}

window.addEventListener("pagehide", stopTracking);

</script>
