<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Oil-Truth LIVE MAP - Auto Live - Warri</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#000;color:#fff;overflow:hidden}
.header{height:50px;background:#000;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:3px solid #00ff88;position:absolute;top:0;left:0;right:0;z-index:1000}
.header b{color:#00ff88}
.live{ background:#00ff88;color:#000;padding:5px 10px;border-radius:20px;font-weight:900;font-size:10px;animation:p 1.5s infinite}
@keyframes p{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
#map{position:absolute;top:50px;left:0;right:0;bottom:0;z-index:1}
#humanAuto{position:absolute;top:50px;left:0;right:0;bottom:0;z-index:5;background:#000}
#humanAuto video{width:100%;height:100%;object-fit:cover}
#mapOverlay{position:absolute;top:50px;left:0;right:0;bottom:0;z-index:10;pointer-events:none}
#gpsDotAuto{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#00ff88;color:#000;padding:10px 18px;border-radius:30px;font-weight:900;border:3px solid #fff;box-shadow:0 0 30px #00ff88;z-index:20;font-size:13px}
.controls{position:absolute;bottom:10px;left:10px;right:10px;z-index:50;display:flex;gap:6px;flex-wrap:wrap}
.controls button{flex:1;padding:10px;border:none;border-radius:20px;font-weight:900;font-size:11px;min-width:100px}
.green{background:#00ff88;color:#000} .red{background:#ff2d2d;color:#fff} .blue{background:rgba(0,0,0,.8);color:#00ff88;border:1px solid #00ff88}
.info{position:absolute;top:60px;left:10px;z-index:50;background:rgba(0,0,0,.85);padding:8px 12px;border-radius:10px;border:1px solid #00ff88;max-width:300px}
.small{font-size:10px;color:#8aa0c5}
</style>
</head>
<body>
<div class="header"><div><b>🛢️ OIL-TRUTH</b> LIVE MAP — HUMAN AUTO LIVE — WARRI</div><div class="live">● AUTO LIVE — NO BUTTON</div></div>

<div id="map"></div>

<div id="humanAuto">
<video id="autoVideo" autoplay playsinline muted></video>
<div id="gpsDotAuto">🔵 LIVE 6.19349, 6.68697 — YOU</div>
</div>

<div class="info">
<div style="color:#00ff88;font-weight:900;font-size:11px">● AUTO LIVE MAP — Camera attach by itself</div>
<div class="small" id="status">Opening link → Map opening → Camera auto-starting → You see people working live — Zoom with pinch — No press start</div>
<div class="small" id="gpsInfoAuto">GPS auto-starting...</div>
</div>

<div class="controls">
<button class="blue" onclick="zoomIn()">🔍 ZOOM IN — See Face</button>
<button class="blue" onclick="zoomOut()">🔍 ZOOM OUT — See Road</button>
<button class="red" onclick="reportAuto()">🔒 SILENT REPORT</button>
</div>

<script>
let map=L.map('map',{zoomControl:false}).setView([5.55,5.78],15);
let sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(map);
let street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19});
let pipe=[[5.516,5.75],[5.55,5.78],[5.67,5.90]];
L.polyline(pipe,{color:'#ff2d2d',weight:8,dashArray:'10,10'}).addTo(map);

let latNow=null, lonNow=null, gpsMk=null;

function logAuto(t){document.getElementById('status').innerText=t;}

// AUTO START CAMERA IMMEDIATELY WHEN LINK CLICKS — NO BUTTON NEEDED
async function autoStartEverything(){
try{
logAuto('Auto-starting camera — Allow camera once — Then next time e go start by itself — You go see live ground NOW');
let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:true});
document.getElementById('autoVideo').srcObject=s;
logAuto('✅ AUTO LIVE ACTIVE — You dey see live ground NOW — People working, moto driving LIVE for map — Zoom with pinch — No Google old — No button press — Camera attach itself');
autoStartGPS();
}catch(e){
logAuto('⚠️ Browser block auto camera — Tap anywhere on screen once — Then camera go start by itself — Chrome need one tap for security — After that e go auto');
document.body.addEventListener('click', async ()=>{
try{
let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920}},audio:true});
document.getElementById('autoVideo').srcObject=s;
logAuto('✅ AUTO LIVE ACTIVE — Now you see live ground — People working LIVE — Zoom to see');
autoStartGPS();
}catch(err){logAuto('Error: '+err.message+' — Use Chrome HTTPS');}
},{once:true});
}
}

function autoStartGPS(){
if(!navigator.geolocation)return;
document.getElementById('gpsInfoAuto').innerText='GPS auto-starting...';
navigator.geolocation.watchPosition(pos=>{
latNow=pos.coords.latitude; lonNow=pos.coords.longitude;
document.getElementById('gpsInfoAuto').innerText='GPS LIVE: '+latNow.toFixed(5)+','+lonNow.toFixed(5)+' Accuracy '+Math.round(pos.coords.accuracy)+'m';
document.getElementById('gpsDotAuto').innerText='🔵 LIVE '+latNow.toFixed(5)+','+lonNow.toFixed(5)+' — YOU — Waka now';
document.getElementById('gpsDotAuto').style.display='block';
if(gpsMk) map.removeLayer(gpsMk);
gpsMk=L.marker([latNow,lonNow],{icon:L.divIcon({html:'<div style="background:#00ff88;color:#000;padding:5px 10px;border-radius:20px;font-weight:900;border:2px solid white">🔵</div>'})}).addTo(map);
},null,{enableHighAccuracy:true,maximumAge:0});
}

function zoomIn(){
let v=document.getElementById('autoVideo');
v.style.transform = (v.style.transform||'') + ' scale(1.3)';
v.style.transformOrigin='center';
logAuto('Zoomed IN — See face very clear — Human working live');
}
function zoomOut(){
let v=document.getElementById('autoVideo');
v.style.transform='scale(1)';
logAuto('Zoomed OUT — See full road — Moto driving live');
}

function reportAuto(){
let n=new Date().toLocaleString();
let g=latNow?latNow.toFixed(5)+','+lonNow.toFixed(5):'GPS auto';
alert('🚨 SILENT REPORT SAVED — HUMAN AUTO LIVE — '+n+' — GPS '+g+' — Live humans, moto, face, voice — Proof for NNPC — Screen record now');
}

// WHEN USER CLICK LINK — IMMEDIATELY START — NO BUTTON
window.addEventListener('load', ()=>{
map.invalidateSize();
autoStartEverything();
});

// Also try to start when page visible
document.addEventListener('visibilitychange', ()=>{
if(document.visibilityState==='visible') autoStartEverything();
});
</script>
</body>
</html>
